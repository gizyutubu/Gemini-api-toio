<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Scratch 通信送信パネル</title>
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
    }
    input {
      width: 75%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      background: #0d9488;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Scratch 送信パネル</h2>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="msgInput" placeholder="Scratchに送る文字を入力...">
      <button id="sendBtn">送信</button>
    </div>
    <div class="status" id="statusLog">TurboWarp でプロジェクトを開いて受信待ちにしてください。</div>
  </div>

  <script>
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusLog = document.getElementById('statusLog');

    function send() {
      const text = msgInput.value.trim();
      if (!text) return;

      // BroadcastChannel への送信
      try {
        const channel = new BroadcastChannel('turbowarp-bridge');
        channel.postMessage(text);
      } catch (e) {}

      // localStorage 経由の送信（別タブ確実検知用）
      localStorage.setItem('scratch_bridge_msg', JSON.stringify({
        text: text,
        time: Date.now()
      }));

      statusLog.textContent = `送信完了: "${text}"`;
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', send);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
