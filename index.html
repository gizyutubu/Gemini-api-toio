<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Scratch 通信モニター</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      gap: 12px;
    }
    .controls {
      display: flex;
      gap: 8px;
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 10px 20px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #14b8a6; }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="controls">
    <input type="text" id="msgInput" placeholder="Scratchに送る文字を入力...">
    <button id="sendBtn">送信</button>
  </div>

  <!-- TurboWarp 埋め込み -->
  <iframe id="twFrame" src="https://turbowarp.org/editor" allow="autoplay"></iframe>

  <script>
    const channel = new BroadcastChannel('turbowarp-bridge');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const twFrame = document.getElementById('twFrame');

    function send() {
      const text = msgInput.value.trim();
      if (!text) return;

      // BroadcastChannel 経由で送信
      channel.postMessage(text);

      // iframe 内部へ直接 postMessage 送信
      if (twFrame.contentWindow) {
        twFrame.contentWindow.postMessage({ type: 'FROM_WEB', text: text }, '*');
      }

      msgInput.value = '';
    }

    sendBtn.addEventListener('click', send);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
